[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frb-isotropy"
version = "0.1.0"
description = "Fast Radio Burst isotropy analysis package."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FRB Isotropy Team" }]
dependencies = [
    "numpy",
    "pandas",
    "healpy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "treecorr",
    "astropy",
    "joblib",
    "tqdm",
    "tqdm-joblib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
